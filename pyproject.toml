[project]
name = "chiprama-interrupt-controller"
version = "0.1.0"
description = "HUD v6 chip-design environment (interrupt_controller_apb cocotb DV authoring)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cocotb==2.0.1",
    "hud[agents]>=0.6.5",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "env.py",
    "tasks.py",
    "task_catalog.py",
    "grader.py",
    "scenario_helpers.py",
    "tasks",
]
